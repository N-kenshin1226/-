<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>起床ログ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Shippori+Mincho+B1:wght@500;700;800&amp;family=Zen+Kaku+Gothic+New:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05080d}
button{font:inherit;cursor:pointer}
.win{position:relative;background:linear-gradient(180deg,rgba(12,28,40,.96),rgba(6,14,22,.97));border:1px solid #2c5866;box-shadow:inset 0 0 0 1px #050a10,inset 0 0 0 3px #8fc7d4,inset 0 0 0 4px #17323d,0 0 50px rgba(111,208,227,.18),0 12px 40px rgba(0,0,0,.7)}
.c{position:absolute;width:30px;height:30px;color:#bfe9f2;pointer-events:none}
.tl{top:-8px;left:-8px}.tr{top:-8px;right:-8px;transform:scaleX(-1)}.bl{bottom:-8px;left:-8px;transform:scaleY(-1)}.br{bottom:-8px;right:-8px;transform:scale(-1,-1)}
.seg{display:flex;gap:2px}
.seg span{width:9px;height:7px;background:#12303b;border:1px solid #23505e}
.seg span.f{background:#8fe0ef;border-color:#c9f3fb}
.seg span.g{background:#f0c26a;border-color:#ffe2a3}
.key{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid #4f8796;border-radius:3px;background:#0b1820;color:#cdeff6;font-family:'Cinzel',serif;font-size:12px;text-align:center}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: 'Zen Kaku Gothic New', sans-serif; color: #d7eef3; background: #05080d;">

  <svg width="1280" height="720" viewBox="0 0 1280 720" aria-hidden="true" style="position: absolute; inset: 0;">
    <defs>
      <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1426"></stop><stop offset="0.6" stop-color="#2a2a45"></stop><stop offset="1" stop-color="#7c5a52"></stop></linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6fd0e3" stop-opacity="0.22"></stop><stop offset="1" stop-color="#6fd0e3" stop-opacity="0"></stop></radialGradient>
    </defs>
    <rect width="1280" height="720" fill="url(#dawn)"></rect>
    <path d="M0 720 V430 H180 V250 H460 V430 H1280 V720 Z" fill="#0a0c14" opacity="0.6"></path>
    <rect x="210" y="280" width="220" height="150" fill="#3b3a5a" opacity="0.55"></rect>
    <path d="M320 280 V430 M210 355 H430" stroke="#0a0c14" stroke-width="8"></path>
    <ellipse cx="640" cy="360" rx="520" ry="320" fill="url(#glow)"></ellipse>
    <rect width="1280" height="720" fill="#03060a" opacity="0.45"></rect>
  </svg>

  <p style="position: absolute; top: 34px; left: 0; right: 0; margin: 0; text-align: center; font-family: 'Shippori Mincho B1', serif; font-size: 17px; color: #b8cfd6; text-shadow: 0 1px 3px #000;">窓の外が白んでいく。身体の奥で、昨日の何かが形になった。</p>

  <section class="win" aria-label="起床ログ" style="position: absolute; left: 270px; top: 84px; width: 740px; height: 560px; box-sizing: border-box; padding: 0;">
    <svg class="c tl" viewBox="0 0 30 30" aria-hidden="true"><path d="M3 28V11c0-4.4 3.6-8 8-8h17" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M8 28V14c0-3.3 2.7-6 6-6h14" fill="none" stroke="currentColor" stroke-width="1"></path><circle cx="4" cy="4" r="3" fill="currentColor"></circle></svg>
    <svg class="c tr" viewBox="0 0 30 30" aria-hidden="true"><path d="M3 28V11c0-4.4 3.6-8 8-8h17" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M8 28V14c0-3.3 2.7-6 6-6h14" fill="none" stroke="currentColor" stroke-width="1"></path><circle cx="4" cy="4" r="3" fill="currentColor"></circle></svg>
    <svg class="c bl" viewBox="0 0 30 30" aria-hidden="true"><path d="M3 28V11c0-4.4 3.6-8 8-8h17" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M8 28V14c0-3.3 2.7-6 6-6h14" fill="none" stroke="currentColor" stroke-width="1"></path><circle cx="4" cy="4" r="3" fill="currentColor"></circle></svg>
    <svg class="c br" viewBox="0 0 30 30" aria-hidden="true"><path d="M3 28V11c0-4.4 3.6-8 8-8h17" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M8 28V14c0-3.3 2.7-6 6-6h14" fill="none" stroke="currentColor" stroke-width="1"></path><circle cx="4" cy="4" r="3" fill="currentColor"></circle></svg>

    <header style="display: flex; align-items: center; justify-content: center; gap: 16px; padding: 22px 0 14px;">
      <span style="height: 1px; width: 120px; background: linear-gradient(90deg, transparent, #8fc7d4);"></span>
      <span style="font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.5em; color: #8fe0ef;">AWAKENING</span>
      <span style="height: 1px; width: 120px; background: linear-gradient(270deg, transparent, #8fc7d4);"></span>
    </header>
    <h1 style="margin: 0; text-align: center; font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 30px; letter-spacing: 0.3em; color: #eaf8fb;">起 床</h1>
    <p style="margin: 6px 0 0; text-align: center; font-size: 14px; color: #8fb5bf;">一年目 春 十三日（日） ・ 宿屋《麦穂亭》 ・ 睡眠の質 <span style="color: #eaf8fb; font-weight: 700;">良好</span></p>

    <div style="margin: 20px 40px 0; display: flex; flex-direction: column;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr) 150px 70px; align-items: center; gap: 16px; height: 52px; border-bottom: 1px solid #17323d;">
          <span style="font-family: 'Shippori Mincho B1', serif; font-size: 19px; color: #eaf8fb;">《{{r.name}}》</span>
          <div class="seg">
            <sc-for list="{{r.cells}}" as="k" hint-placeholder-count="20"><span class="{{k}}"></span></sc-for>
          </div>
          <span style="font-family: 'Cinzel', serif; font-size: 18px; color: #8fb5bf; text-align: right;">{{r.from}} <span style="color: #6fa5b2;">›</span> <span style="color: #eaf8fb; font-weight: 700;">{{r.to}}</span></span>
          <span style="font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: #f0c26a; text-align: right;">+{{r.delta}}</span>
        </div>
      </sc-for>
      <div style="display: flex; gap: 24px; height: 44px; align-items: center; font-size: 14px; color: #8fb5bf;">
        <span>筋力 <span style="font-family: 'Cinzel', serif; color: #f0c26a;">+0.2</span></span>
        <span>持久 <span style="font-family: 'Cinzel', serif; color: #f0c26a;">+0.3</span></span>
        <span>器用 <span style="font-family: 'Cinzel', serif; color: #f0c26a;">+0.1</span></span>
        <span style="margin-left: auto;">本日の風　<span style="color: #f0c26a;">▲《鍛冶》</span>　<span style="color: #f2b39a;">▼ 格上との戦い</span></span>
      </div>
    </div>

    <div style="position: relative; margin: 14px 40px 0; padding: 18px 20px; background: linear-gradient(90deg, rgba(111,208,227,0), rgba(111,208,227,.16), rgba(111,208,227,0)); border-top: 1px solid #8fe0ef; border-bottom: 1px solid #8fe0ef; text-align: center;">
      <p style="margin: 0; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.5em; color: #8fe0ef;">NEW SKILL</p>
      <p style="margin: 6px 0 0; font-size: 18px; color: #f2fcfe;">――条件を満たしました。スキル《<span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 22px; color: #ffffff; text-shadow: 0 0 12px rgba(143,224,239,.9);">見切り</span>》を獲得しました。</p>
    </div>
  </section>

  <div style="position: absolute; right: 28px; bottom: 18px; display: flex; gap: 20px; font-size: 13px; color: #b8cfd6;">
    <span><span class="key">Enter</span> 起きる</span>
    <span><span class="key">S</span> ステータス</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const cells = (filled, gained) => Array.from({ length: 20 }, (_, i) => i < filled ? 'f' : i < filled + gained ? 'g' : '');
    return {
      rows: [
        { name: '観察', from: '17.6', to: '18.4', delta: '0.8', cells: cells(10, 1) },
        { name: '回避', from: '11.0', to: '12.3', delta: '1.3', cells: cells(2, 1) },
        { name: '鍛冶', from: '30.0', to: '31.7', delta: '1.7', cells: cells(6, 3) }
      ]
    };
  }
}
</script>
</body>
</html>
